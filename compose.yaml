services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run --no-sync uvicorn project_api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      APP_VERSION: 0.1.0
    volumes:
      - ./src:/app/src
